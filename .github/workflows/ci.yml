name: CI Pipeline

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build_and_lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Assuming standard modern Node.js context
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Run Linter
        run: npm run lint
        
      - name: Run Build
        run: npm run build
