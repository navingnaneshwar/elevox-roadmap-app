name: PR Checks — Lint & Build

on:
  pull_request:
    branches: [qa, main]

jobs:
  check:
    name: Lint + Build Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build check
        run: npm run build
        env:
          # Use QA vars for PR build checks — safe, not prod
          VITE_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
          VITE_ENV: qa
